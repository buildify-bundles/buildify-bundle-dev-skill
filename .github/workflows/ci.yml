name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        if: matrix.python == '3.12'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        env:
          RUN_MAVEN: ${{ matrix.python == '3.12' && '1' || '0' }}
        run: python -m unittest discover -s tests -v
